<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makeovers by Jyotika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0d0b;
    --bg2:#14110d;
    --gold:#c9a84c;
    --gold-bright:#e8c96a;
    --cream:#f1e7d4;
    --dim:#b7a888;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 70%);
    font-family:'Jost', sans-serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:420px;
    border:1px solid rgba(201,168,76,0.4);
    border-radius:18px;
    padding:40px 30px;
    text-align:center;
    background:rgba(255,255,255,0.015);
    box-shadow:0 0 40px rgba(0,0,0,0.5);
  }
  .logo-img{
    width:110px;
    height:auto;
    margin:0 auto 14px;
    display:block;
  }
  h1{
    font-family:'Marcellus', 'Cormorant Garamond', serif;
    font-weight:500;
    letter-spacing:2px;
    font-size:26px;
    color:var(--gold-bright);
    text-transform:uppercase;
  }
  .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--dim);
    margin-top:8px;
    font-size:16px;
  }
  .sub{
    margin-top:22px;
    font-size:14px;
    color:var(--dim);
    line-height:1.5;
  }
  form{margin-top:28px; text-align:left;}
  label{
    display:block;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  input{
    width:100%;
    padding:12px 14px;
    margin-bottom:18px;
    background:transparent;
    border:1px solid rgba(201,168,76,0.5);
    border-radius:8px;
    color:var(--cream);
    font-family:'Jost', sans-serif;
    font-size:15px;
    outline:none;
  }
  input:focus{border-color:var(--gold-bright);}
  input::placeholder{color:rgba(183,168,136,0.5);}
  button{
    width:100%;
    padding:14px;
    background:linear-gradient(135deg, var(--gold), var(--gold-bright));
    border:none;
    border-radius:8px;
    color:#14110d;
    font-family:'Jost', sans-serif;
    font-weight:500;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:14px;
    cursor:pointer;
    transition:opacity 0.2s;
  }
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .status{
    margin-top:16px;
    font-size:14px;
    color:var(--gold-bright);
    min-height:20px;
  }
  .footer-note{
    margin-top:26px;
    font-size:11px;
    color:rgba(183,168,136,0.5);
    letter-spacing:0.5px;
  }
  .review-link{
    display:block;
    margin-top:14px;
    font-size:12px;
    color:var(--gold);
    text-decoration:none;
    letter-spacing:0.5px;
    opacity:0.8;
  }
  .review-link:hover{opacity:1;}
</style>
</head>

  <h1>Jyotika Anand</h1>
  <div class="tagline">Creating beauty that reconnects you to yourself.</div>
  <div class="sub">Thank you for letting me be part of your day! Please share your details below — you'll be taken straight to my Instagram right after.</div>

  <form id="leadForm" name="lead-capture" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="lead-capture" />
    <p style="display:none;"><label>Don't fill this out: <input name="bot-field" /></label></p>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your full name" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10,}" required>

    <button type="submit" id="submitBtn">Submit &amp; Follow on Instagram</button>
    <div class="status" id="statusMsg"></div>
  </form>

  <div class="footer-note">Makeovers by Jyotika &middot; @makeoversbyjyotika</div>
</div>

<script>
  const INSTAGRAM_URL = "https://www.instagram.com/makeoversbyjyotika?igsh=ZHE5bjQyOWQ4dmQy&utm_source=qr";

  const form = document.getElementById('leadForm');
  const btn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Submitting...";

    const formData = new FormData(form);
    const encoded = new URLSearchParams(formData).toString();

    fetch("/welcome.html", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: encoded
    })
    .then(() => {
      statusMsg.textContent = "Thank you! Taking you to Instagram now...";
      setTimeout(function(){
        window.location.href = INSTAGRAM_URL;
      }, 900);
    })
    .catch(() => {
      // Even if the form post has an issue, still get them to Instagram
      statusMsg.textContent = "Redirecting to Instagram...";
      setTimeout(function(){
        window.location.href = INSTAGRAM_URL;
      }, 900);
    });
  });
</script>
