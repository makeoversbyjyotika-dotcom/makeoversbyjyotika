<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thank You — Makeovers by Jyotika</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#0f0d0b;--bg2:#161210;--bg3:#1c1714;
    --gold:#c9a84c;--gold2:#e8c96a;--gold3:#f5e0a0;--gold-dim:#7a6030;
    --cream:#fdf8ee;--text:#e8dcc8;--text-dim:#9a8a70;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;
  }
  .card{max-width:560px}
  .mark{font-size:3rem;color:var(--gold2);margin-bottom:1.5rem}
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:400;font-size:2.6rem;line-height:1.15;
    color:var(--cream);margin-bottom:1.2rem;
  }
  p{font-size:0.95rem;color:var(--text-dim);line-height:1.7;margin-bottom:2.5rem}
  a.btn{
    display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--bg);
    padding:1rem 2.4rem;text-decoration:none;font-size:0.72rem;font-weight:600;letter-spacing:0.22em;
    text-transform:uppercase;transition:opacity 0.3s,transform 0.2s;
  }
  a.btn:hover{opacity:0.88;transform:translateY(-1px)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✨</div>
    <h1>Thank you! Your inquiry has been submitted successfully.</h1>
    <p>Jyotika will be in touch within 24 hours to discuss your vision, your date, and the woman you want to step into.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
</html>
